openapi: 3.0.3
info:
  title: Library Classifier Catalog API
  version: 1.0.0
  description: Rutas de consulta XML/JSON que acompañan al contrato SOAP.
servers:
  - url: http://127.0.0.1:5001
tags:
  - name: Catálogo
    description: Consultas de libros y conceptos
  - name: Servicio
    description: Estado, documentación y contrato SOAP
paths:
  /health:
    tags: [Servicio]
    get:
      summary: Comprueba el servicio y PostgreSQL
      responses:
        '200': {description: Disponible}
        '503': {description: PostgreSQL no disponible}
  /books:
    tags: [Catálogo]
    get:
      summary: Lista libros
      parameters:
        - {name: format, in: query, schema: {type: string, enum: [xml, json], default: xml}}
      responses:
        '200': {description: Catálogo en XML o JSON}
    post:
      summary: Agrega un libro al catálogo
      parameters:
        - {name: format, in: query, schema: {type: string, enum: [xml, json], default: xml}}
      requestBody:
        required: true
        content:
          application/json: {schema: {type: object, required: [isbn, title], properties: {isbn: {type: string}, title: {type: string}, author: {type: string}, publisher: {type: string}, publicationYear: {type: integer}, price: {type: number}, stock: {type: integer}, description: {type: string}, format: {type: string}}}}
      responses:
        '201': {description: Libro creado}
        '400': {description: isbn o title faltante}
  /books/{isbn}:
    tags: [Catálogo]
    get:
      summary: Obtiene un libro por ISBN
      parameters:
        - {name: isbn, in: path, required: true, schema: {type: string}}
        - {name: format, in: query, schema: {type: string, enum: [xml, json], default: xml}}
      responses:
        '200': {description: Libro encontrado}
        '404': {description: Libro no encontrado}
  /books/minimal:
    tags: [Catálogo]
    get:
      summary: Lista ISBN, título, autor e imagen
      responses:
        '200': {description: Resumen del catálogo}
  /books/concepts:
    tags: [Catálogo]
    get:
      summary: Lista conceptos Cloud y libros relacionados
      responses:
        '200': {description: Conceptos del catálogo}
  /docs:
    tags: [Servicio]
    get:
      summary: Interfaz web de Swagger UI
      responses:
        '200': {description: Documentación interactiva}
  /openapi.yaml:
    tags: [Servicio]
    get:
      summary: Especificación OpenAPI
      responses:
        '200': {description: Documento OpenAPI en YAML}
  /library-classifier.wsdl:
    tags: [Servicio]
    get:
      summary: Contrato WSDL del servicio SOAP
      responses:
        '200': {description: WSDL}
  /soap:
    tags: [Servicio]
    post:
      summary: Contrato SOAP document/literal
      requestBody:
        required: true
        content:
          text/xml: {schema: {type: string}}
      responses:
        '200': {description: SOAP response}
        '400': {description: SOAP Fault de cliente}
        '401': {description: Fault de autenticación}
        '409': {description: Clasificación duplicada}
